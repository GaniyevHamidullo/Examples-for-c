name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: list file
      run: ls -la
    - name: compile c program
      run: gcc main.c -o birin
    - name: result
      uses: actions/upload-artifact@v4
      with: 
        name: birin
        path: birin
